<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PipeLine de Historias vidigozTV</title>
  <link rel="icon" type="image/png" href="/icons/favicon.png" />
  <link rel="apple-touch-icon" href="/icons/favicon.png" />
  <style>
    :root {
      --bg: #14161a;
      --card: #1e2127;
      --card-2: #262a32;
      --border: #333842;
      --text: #e7e9ec;
      --muted: #9aa1ab;
      --accent: #4f8cff;
      --accent-strong: #2f6fe0;
      --ok: #3fb96b;
      --warn: #d9a33a;
      --err: #e15b5b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
      -webkit-text-size-adjust: 100%;
    }
    header {
      padding: 18px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    header h1 { font-size: 1.05rem; margin: 0; font-weight: 600; }
    .version { font-size: 0.72rem; font-weight: 400; color: var(--muted); margin-left: 6px; vertical-align: middle; }
    .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .logo { height: 46px; width: auto; max-width: 130px; object-fit: contain; border-radius: 8px; display: block; flex: 0 0 auto; }
    .wrap { max-width: 1400px; margin: 0 auto; padding: 16px; }
    section { margin-bottom: 26px; }
    section > h2 {
      font-size: 0.95rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
      margin: 0 0 12px;
    }
    button {
      font: inherit;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--card-2);
      color: var(--text);
      border-radius: 8px;
      padding: 9px 14px;
      transition: background 0.12s, opacity 0.12s;
    }
    button:hover { background: #2f3540; }
    button:disabled { opacity: 0.5; cursor: default; }
    select {
      font: inherit;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--card-2);
      color: var(--text);
      border-radius: 8px;
      padding: 9px 12px;
    }
    button.primary {
      background: var(--accent);
      border-color: var(--accent-strong);
      color: #fff;
      font-weight: 600;
    }
    button.primary:hover { background: var(--accent-strong); }
    .big {
      width: 100%;
      font-size: 1.05rem;
      padding: 16px;
      border-radius: 12px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
    }
    .historias-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 16px; }
    .historias-col > h3 { font-size: 0.85rem; color: var(--muted); margin: 0 0 8px; }
    /* Cada columna scrollea por dentro: Programado puede traer decenas de filas. */
    .historias-col .card { max-height: 70vh; overflow-y: auto; }
    @media (max-width: 1280px) {
      .historias-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
    @media (max-width: 900px) {
      .historias-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 620px) {
      .historias-grid { grid-template-columns: 1fr; }
    }
    /* Cada historia es una tarjeta: el título es un link clicable y debajo va
       una línea de subtítulos informativos (Estado, Categoría, Antigüedad,
       fecha de creación). */
    .hist-lista { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
    .hist-item { padding-bottom: 12px; border-bottom: 1px solid var(--border); }
    .hist-item:last-child { padding-bottom: 0; border-bottom: none; }
    .hist-titulo {
      display: block;
      color: var(--text);
      font-size: 0.9rem;
      font-weight: 600;
      line-height: 1.3;
      text-decoration: underline;
      text-decoration-color: var(--border);
    }
    .hist-titulo:hover { text-decoration-color: var(--text); }
    .hist-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px 8px;
      margin-top: 6px;
      font-size: 0.75rem;
      color: var(--muted);
    }
    .estado {
      display: inline-block;
      padding: 2px 9px;
      border-radius: 999px;
      font-size: 0.72rem;
      background: var(--card-2);
      border: 1px solid var(--border);
      white-space: nowrap;
    }
    .fecha { color: var(--muted); white-space: nowrap; }
    .msg { font-size: 0.85rem; }
    .msg.ok { color: var(--ok); }
    .msg.err { color: var(--err); }
    .msg.warn { color: var(--warn); }
    /* Overlay de login */
    #login {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 10;
    }
    #login .box { width: 100%; max-width: 340px; text-align: center; }
    #login h1 { font-size: 1.1rem; margin-bottom: 4px; }
    #login p { color: var(--muted); font-size: 0.85rem; margin-top: 0; }
    #login input {
      width: 100%;
      padding: 12px;
      font-size: 1rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      margin: 12px 0;
    }
    .row-actions { display: flex; gap: 6px; flex-wrap: wrap; }
  </style>
</head>
<body>
  <!-- Login: pide contraseña una vez, la guarda solo en memoria de sesión -->
  <div id="login">
    <div class="box">
      <h1>Panel del Pipeline</h1>
      <p>Historias medievales · VidiGozTV</p>
      <input id="pw" type="password" placeholder="Contraseña" autocomplete="current-password" />
      <button class="primary big" id="login-btn">Entrar</button>
      <p class="msg err" id="login-err"></p>
    </div>
  </div>

  <div id="app" hidden>
    <header>
      <div class="brand">
        <img class="logo" src="/icons/icon.png" alt="VidiGozTV" />
        <h1>PipeLine de Historias vidigozTV <span class="version">v1.0.7</span></h1>
      </div>
      <button id="logout">Salir</button>
    </header>

    <div class="wrap">
      <!-- Panel de historias -->
      <section>
        <h2>Historias <button id="refresh" style="font-size:0.78rem;padding:4px 10px;">↻ Actualizar</button></h2>
        <div class="row-actions" style="margin-bottom:14px;">
          <select id="filtro-categoria">
            <option value="all">Todas las categorías</option>
          </select>
          <select id="filtro-antiguedad">
            <option value="all">Cualquier antigüedad</option>
          </select>
        </div>
        <div class="historias-grid">
          <div class="historias-col">
            <h3>En revisión</h3>
            <div class="card" id="revision-card">
              <p class="muted" id="revision-loading">Cargando…</p>
              <ul class="hist-lista" id="revision-lista" hidden></ul>
            </div>
          </div>
          <div class="historias-col">
            <h3>Listas</h3>
            <div class="card" id="listas-card">
              <p class="muted" id="listas-loading">Cargando…</p>
              <ul class="hist-lista" id="listas-lista" hidden></ul>
            </div>
          </div>
          <div class="historias-col">
            <h3>Programadas</h3>
            <div class="card" id="programadas-card">
              <p class="muted" id="programadas-loading">Cargando…</p>
              <ul class="hist-lista" id="programadas-lista" hidden></ul>
            </div>
          </div>
          <div class="historias-col">
            <h3>Listas para carrusel</h3>
            <div class="card" id="lista-carrusel-card">
              <p class="muted" id="lista-carrusel-loading">Cargando…</p>
              <ul class="hist-lista" id="lista-carrusel-lista" hidden></ul>
            </div>
          </div>
          <div class="historias-col">
            <h3>Carrusel</h3>
            <div class="card" id="carrusel-card">
              <p class="muted" id="carrusel-loading">Cargando…</p>
              <ul class="hist-lista" id="carrusel-lista" hidden></ul>
            </div>
          </div>
        </div>
      </section>
    </div>
  </div>

  <script>
    // ---- Estado y auth ----
    // La contraseña vive solo en memoria de la sesión del navegador (sessionStorage),
    // nunca en localStorage. Se pierde al cerrar la pestaña.
    const KEY = 'vidigoz_dash_pw';
    let PW = sessionStorage.getItem(KEY) || '';

    // Las 5 listas del panel. Cada columna define su propio predicado sobre
    // una historia: las tres primeras filtran por Estado, y las de "Listas
    // para carrusel" y "Carrusel" por sus respectivos checkboxes de Notion
    // (por eso pueden repetir historias que ya salen en Programado — son
    // vistas distintas del mismo panorama).
    const COLUMNAS = [
      { clave: 'revision',       filtrar: (h) => h.estado === 'Revision',   mensajeVacio: 'No hay historias esperando tu revisión.' },
      { clave: 'listas',         filtrar: (h) => h.estado === 'Listo',      mensajeVacio: 'No hay historias listas todavía.' },
      { clave: 'programadas',    filtrar: (h) => h.estado === 'Programado', mensajeVacio: 'No hay historias programadas.' },
      { clave: 'lista-carrusel', filtrar: (h) => h.listaCarrusel === true,  mensajeVacio: 'No hay historias marcadas como Lista para carrusel.' },
      { clave: 'carrusel',       filtrar: (h) => h.carrusel === true,       mensajeVacio: 'No hay historias marcadas como Carrusel.' },
    ];

    // Filtros activos (Categoria/Antiguedad, ambos propiedades "select" de
    // Notion) y última respuesta cruda del backend, para poder re-pintar
    // sin volver a pedir datos a Notion en cada cambio de filtro.
    let filtroCategoria = 'all';
    let filtroAntiguedad = 'all';
    let ultimasHistorias = [];

    // ---- Helper de fetch autenticado ----
    async function api(path, body) {
      const res = await fetch('/.netlify/functions/' + path, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-dashboard-password': PW },
        body: JSON.stringify(body || {}),
      });
      let data = null;
      try { data = await res.json(); } catch (_) {}
      if (res.status === 401) { logout(); throw new Error('Contraseña incorrecta.'); }
      if (!res.ok || (data && data.ok === false)) {
        throw Object.assign(new Error((data && data.error) || ('Error ' + res.status)), { status: res.status, data });
      }
      return data;
    }

    function fmtFecha(iso) {
      if (!iso) return '—';
      try {
        return new Date(iso).toLocaleDateString('es-MX', { day: '2-digit', month: 'short', year: 'numeric' });
      } catch (_) { return iso; }
    }

    // ---- Login ----
    async function intentarLogin(pw) {
      PW = pw;
      // Validamos contra un endpoint real (listar-historias) para confirmar la contraseña.
      await api('listar-historias');
      sessionStorage.setItem(KEY, pw);
    }

    function mostrarApp() {
      document.getElementById('login').style.display = 'none';
      document.getElementById('app').hidden = false;
      cargarHistorias();
    }

    function logout() {
      sessionStorage.removeItem(KEY);
      PW = '';
      document.getElementById('app').hidden = true;
      document.getElementById('login').style.display = 'flex';
      document.getElementById('pw').value = '';
    }

    document.getElementById('login-btn').addEventListener('click', doLogin);
    document.getElementById('pw').addEventListener('keydown', (e) => { if (e.key === 'Enter') doLogin(); });
    document.getElementById('logout').addEventListener('click', logout);

    async function doLogin() {
      const pw = document.getElementById('pw').value;
      const err = document.getElementById('login-err');
      const btn = document.getElementById('login-btn');
      err.textContent = '';
      if (!pw) { err.textContent = 'Escribe la contraseña.'; return; }
      btn.disabled = true; btn.textContent = 'Entrando…';
      try {
        await intentarLogin(pw);
        mostrarApp();
      } catch (e) {
        err.textContent = e.message || 'No se pudo entrar.';
      } finally {
        btn.disabled = false; btn.textContent = 'Entrar';
      }
    }

    // ---- Historias ----
    document.getElementById('refresh').addEventListener('click', cargarHistorias);
    document.getElementById('filtro-categoria').addEventListener('change', (e) => {
      filtroCategoria = e.target.value;
      pintarListas();
    });
    document.getElementById('filtro-antiguedad').addEventListener('change', (e) => {
      filtroAntiguedad = e.target.value;
      pintarListas();
    });

    async function cargarHistorias() {
      for (const col of COLUMNAS) {
        const loading = document.getElementById(col.clave + '-loading');
        loading.hidden = false;
        loading.textContent = 'Cargando…';
        document.getElementById(col.clave + '-lista').hidden = true;
      }
      try {
        const r = await api('listar-historias');
        ultimasHistorias = r.historias;
        poblarOpcionesFiltro(r.opciones);
        pintarListas();
      } catch (e) {
        for (const col of COLUMNAS) {
          document.getElementById(col.clave + '-loading').textContent = 'Error: ' + e.message;
        }
      }
    }

    // Llena los <select> de filtro con las opciones reales que existen en
    // Notion (Category/Antiguedad), en vez de tenerlas hardcodeadas, para
    // que una categoría nueva agregada en Notion aparezca sola. Conserva la
    // selección actual si sigue siendo válida.
    function poblarOpciones(select, valores) {
      const actual = select.value;
      select.querySelectorAll('option:not([value="all"])').forEach((o) => o.remove());
      for (const v of valores) {
        const opt = document.createElement('option');
        opt.value = v;
        opt.textContent = v;
        select.appendChild(opt);
      }
      if (valores.includes(actual)) select.value = actual;
    }

    function poblarOpcionesFiltro(opciones) {
      if (!opciones) return;
      poblarOpciones(document.getElementById('filtro-categoria'), opciones.categorias || []);
      poblarOpciones(document.getElementById('filtro-antiguedad'), opciones.antiguedades || []);
    }

    // Aplica los filtros de Categoria/Antiguedad (independiente del estado).
    function pasaFiltros(h) {
      return (filtroCategoria === 'all' || h.categoria === filtroCategoria)
          && (filtroAntiguedad === 'all' || h.antiguedad === filtroAntiguedad);
    }

    // Pinta las 5 listas a partir de `ultimasHistorias`, sin volver a pedir
    // datos a Notion (se usa tanto al cargar como al cambiar un filtro).
    function pintarListas() {
      for (const col of COLUMNAS) {
        renderLista(col, {
          listaId: col.clave + '-lista',
          loadingId: col.clave + '-loading',
        });
      }
    }

    function renderLista({ filtrar, mensajeVacio }, { listaId, loadingId }) {
      const historias = ultimasHistorias.filter((h) => filtrar(h) && pasaFiltros(h));
      const lista = document.getElementById(listaId);
      const loading = document.getElementById(loadingId);

      lista.innerHTML = '';
      if (!historias.length) {
        lista.hidden = true;
        loading.hidden = false;
        loading.textContent = mensajeVacio;
        return;
      }
      for (const h of historias) {
        lista.appendChild(itemHistoria(h));
      }
      loading.hidden = true;
      lista.hidden = false;
    }

    // Una historia como tarjeta: el título es un link a la página de Notion y
    // debajo va una línea de subtítulos informativos (Estado, Categoría,
    // Antigüedad y fecha de creación).
    function itemHistoria(h) {
      const li = document.createElement('li');
      li.className = 'hist-item';

      const titulo = document.createElement(h.url ? 'a' : 'span');
      titulo.className = 'hist-titulo';
      if (h.url) {
        titulo.href = h.url;
        titulo.target = '_blank';
        titulo.rel = 'noopener noreferrer';
      }
      titulo.textContent = h.titulo;

      const meta = document.createElement('div');
      meta.className = 'hist-meta';

      const estado = document.createElement('span');
      estado.className = 'estado';
      estado.textContent = h.estado;

      const categoria = document.createElement('span');
      categoria.textContent = h.categoria || '—';

      const antiguedad = document.createElement('span');
      antiguedad.textContent = h.antiguedad || '—';

      const fecha = document.createElement('span');
      fecha.className = 'fecha';
      fecha.textContent = fmtFecha(h.creado);

      meta.append(estado, categoria, antiguedad, fecha);
      li.append(titulo, meta);
      return li;
    }

    // ---- Arranque ----
    // Si ya hay contraseña en memoria de sesión, intentamos entrar directo.
    (async () => {
      if (PW) {
        try { await api('listar-historias'); mostrarApp(); return; } catch (_) { logout(); }
      }
      document.getElementById('pw').focus();
    })();
  </script>
</body>
</html>
